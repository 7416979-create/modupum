name: diag-alio
on:
  push:
    paths: ['.github/diag/run-alio.txt']
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          sudo apt-get install -y poppler-utils >/dev/null
          pip install pyhwp >/dev/null
      - run: node scripts/diag-alio.mjs
        env:
          MIXED_MAX_ROWS: '600'
          MIXED_BUDGET_MIN: '20'
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - run: |
          git config user.name "modupum-bot"
          git config user.email "modupum-bot@users.noreply.github.com"
          git add logs/diag-alio.json
          git commit -m "diag: alio fields"
          git pull --rebase origin main
          git push
