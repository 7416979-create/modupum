name: probe-gojobs

# 나라일터 공개 목록 페이지의 구조를 확인하는 읽기 전용 점검(사이트 데이터는 바꾸지 않는다). 수동 실행만 가능하다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 상세 링크와 쪽 넘김 확인
        run: |
          UA="modupum-bot (+https://modupum.kr)"
          BASE='https://www.gojobs.go.kr/apmList.do'
          curl -sS --retry 2 --retry-delay 10 --retry-all-errors -m 60 -A "$UA" -c /tmp/cj -o /tmp/get.html -G "$BASE" --data-urlencode 'menuNo=401' --data-urlencode 'mngrMenuYn=N' --data-urlencode 'selMenuNo=400' --data-urlencode 'upperMenuNo=' --data-urlencode 'searchKeyword=장애' --data-urlencode 'searchJobsecode=020'
          sleep 3
          curl -sS -m 60 -A "$UA" -b /tmp/cj -o /tmp/common.js 'https://www.gojobs.go.kr/jsp/cmmn/js/common.js'
          python3 - <<'PY'
          import re
          s = open('/tmp/get.html', encoding='utf-8', errors='replace').read()
          c = open('/tmp/common.js', encoding='utf-8', errors='replace').read()
          for name, src in (('page', s), ('common.js', c)):
              for fn in ('fn_apmView', 'fn_goPage', 'fn_page', 'fn_apmList'):
                  for m in re.finditer(r'function\s+' + fn + r'\s*\(', src):
                      print('==', name, fn)
                      print(re.sub(r'\s+', ' ', src[m.start():m.start()+700]))
          print('== pagination html')
          i = s.find('class="paging')
          if i < 0: i = s.find('paging')
          print(re.sub(r'\s+', ' ', s[i:i+1800]) if i >= 0 else 'no paging marker')
          print('== rows')
          rows = re.findall(r'<tr\s*>.*?</tr>', s[s.find('<tbody'):], re.S)
          print(len(rows), 'rows on page 1')
          PY
