name: probe-gojobs

# 나라일터 공개 목록 페이지의 구조를 확인하는 읽기 전용 점검(사이트 데이터는 바꾸지 않는다). 수동 실행만 가능하다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 상세 링크 방식 확인
        run: |
          UA="modupum-bot (+https://modupum.kr)"
          curl -sS --retry 2 --retry-delay 10 --retry-all-errors -m 60 -A "$UA" -o /tmp/list.js 'https://www.gojobs.go.kr/jsp/apm/apmListNew.js'
          python3 - <<'PY'
          import re
          c = open('/tmp/list.js', encoding='utf-8', errors='replace').read()
          print('size', len(c))
          for m in re.finditer(r'fn_apmView\s*[=(:]', c):
              print(re.sub(r'\s+', ' ', c[max(0, m.start()-60):m.start()+900]))
              break
          PY
