name: update-and-deploy

on:
  schedule:
    # GitHub는 UTC 기준. 정각 지연을 피해 47분에 실행: 한국시간 약 10시, 14시, 18시 = UTC 00:47, 04:47, 08:47
    - cron: '47 0 * * *'
    - cron: '47 4 * * *'
    - cron: '47 8 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '주말·공휴일이어도 일자리 수집을 강제로 실행'
        type: boolean
        default: true
  push:
    branches: [main]

env:
  # 수동 실행에서 force 를 켜면 평일 판정을 무시하고 일자리를 수집한다. 예약·푸시 실행은 평일(KST)에만 일자리를 수집한다.
  # 복지·소식 수집과 배포는 요일과 상관없이 항상 실행한다.
  FORCE_COLLECT: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '' }}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Collect public data
        # 수집이 실패해도 기존 데이터로 빌드·배포를 계속한다(실패는 로그에 남는다).
        continue-on-error: true
        run: node scripts/collect.mjs
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - name: Collect policy news (보건복지부 보도자료 RSS, 키 불필요)
        # 실패·이상 시 기존 news.json 을 유지한다.
        continue-on-error: true
        run: node scripts/collect-news.mjs
      - name: Collect KEAD jobs (한국장애인고용공단 채용정보, 키 불필요)
        # 실패·차단 시 기존 jobs.json 을 그대로 두고 로그에 남긴다.
        continue-on-error: true
        run: node scripts/collect-kead.mjs
      - name: Review ambiguous jobs (Gemini 묶음 판정, 하루 1회 주기 · 키 없으면 건너뜀)
        # 대기열이 비었거나 주기가 안 됐으면 호출하지 않는다. 실패하면 대기 항목은 2차(Haiku)로 남는다.
        continue-on-error: true
        run: node scripts/review-run.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: List jobs waiting for summary (PC 작업이 처리할 대기 목록)
        # 목록만 기록한다. 실패해도 기존 pending.json 을 유지한다.
        continue-on-error: true
        run: node scripts/autosum-pending.mjs
      - name: Validate data (검수 실패 시 저장·배포 중단)
        run: node scripts/validate-jobs.mjs --fix
      - name: Save data changes
        run: |
          git config user.name "modupum-bot"
          git config user.email "modupum-bot@users.noreply.github.com"
          git add public/data scripts/review-queue.json scripts/pending.json
          git diff --cached --quiet || git commit -m "data: auto update"
          # PC 요약 작업(autosum)이 먼저 푸시했을 수 있으므로 최신 위에 얹어 푸시한다. 충돌하면 이번 분은 건너뛰고 다음 수집이 다시 만든다.
          git pull --rebase origin main || git rebase --abort
          git push || true
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
