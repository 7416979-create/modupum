name: update-and-deploy

on:
  schedule:
    # GitHub는 UTC 기준. 정각 지연을 피해 47분에 실행: 한국시간 약 10시, 14시, 18시 = UTC 00:47, 04:47, 08:47
    - cron: '47 0 * * *'
    - cron: '47 4 * * *'
    - cron: '47 8 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Collect public data
        # 수집이 실패해도 기존 데이터로 빌드·배포를 계속한다(실패는 로그에 남는다).
        continue-on-error: true
        run: node scripts/collect.mjs
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - name: Collect policy news (보건복지부 보도자료 RSS, 키 불필요)
        # 실패·이상 시 기존 news.json 을 유지한다.
        continue-on-error: true
        run: node scripts/collect-news.mjs
      - name: Validate data (검수 실패 시 저장·배포 중단)
        run: node scripts/validate-jobs.mjs --fix
      - name: Save data changes
        run: |
          git config user.name "modupum-bot"
          git config user.email "modupum-bot@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "data: auto update"
          git push || true
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
